apiVersion: v1
entries:
  estadea:
  - annotations:
      artifacthub.io/changes: |
        - kind: added
          description: Initial release of estadea operator
      artifacthub.io/crds: |
        - kind: PodReaper
          version: v1alpha1
          name: podreapers.reaper.estadea.io
          displayName: Pod Reaper
          description: >
            Defines a set of rules for automatically cleaning up pods stuck in
            Terminating, Pending, Unknown or Failed state.
      artifacthub.io/crdsExamples: |
        - apiVersion: reaper.estadea.io/v1alpha1
          kind: PodReaper
          metadata:
            name: cluster-reaper
          spec:
            namespaces:
              - default
              - production
            podStates:
              - Terminating
              - Unknown
            graceTimeout: "5m"
            checkInterval: "30s"
        - apiVersion: reaper.estadea.io/v1alpha1
          kind: PodReaper
          metadata:
            name: aggressive-reaper
          spec:
            podStates:
              - Terminating
            graceTimeout: "2m"
            checkInterval: "15s"
      artifacthub.io/license: Apache-2.0
      artifacthub.io/operatorCapabilities: Basic Install
    apiVersion: v2
    appVersion: 0.1.2
    created: "2026-06-14T21:42:42.942260543Z"
    description: 'Kubernetes operator that automatically force-deletes pods stuck
