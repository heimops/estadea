apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "estadea.fullname" . }}-manager-rolebinding
  labels:
    {{- include "estadea.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "estadea.fullname" . }}-manager-role
subjects:
  - kind: ServiceAccount
    name: {{ include "estadea.serviceAccountName" . }}
    namespace: {{ include "estadea.namespace" . }}
