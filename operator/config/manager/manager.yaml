apiVersion: v1
kind: Namespace
metadata:
  name: estadea-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: estadea-controller-manager
  namespace: estadea-system
  labels:
    app: estadea
    control-plane: controller-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: estadea
      control-plane: controller-manager
  template:
    metadata:
      labels:
        app: estadea
        control-plane: controller-manager
    spec:
      serviceAccountName: estadea-controller-manager
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: ghcr.io/heimops/estadea:latest
          imagePullPolicy: IfNotPresent
          command:
            - /manager
          args:
            - --leader-elect
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
